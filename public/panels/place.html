<!-- public/panels/place.html : contenu du panneau d'info d'un lieu -->

<!-- Nom du lieu -->
<header data-place-head>
  <h5 data-field="name"></h5>
</header>

<!-- Photos / vidéos : carrousel horizontal, toute la largeur -->
<section data-place-gallery>
  <div data-carousel>
    <ul data-list="media"></ul>

    <button type="button" data-carousel-prev aria-label="Photo précédente" hidden>
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" data-carousel-next aria-label="Photo suivante" hidden>
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
    <span data-carousel-counter hidden></span>
  </div>

  <p data-empty="media" hidden>Aucune photo. Ajoute-en depuis la fiche du lieu.</p>
</section>

<form data-place-form>
  <label>
    Nom
    <input type="text" name="name" required maxlength="200">
  </label>

  <label>
    Type
    <select name="type">
      <option value="DEFAULT">Lieu</option>
      <option value="CITY">Ville</option>
      <option value="HIKE">Randonnée</option>
      <option value="ACTIVITY">Activité</option>
      <option value="VIEWPOINT">Point de vue</option>
    </select>
  </label>

  <fieldset>
    <legend>Statut</legend>
    <label><input type="radio" name="visited" value="false"> À visiter</label>
    <label><input type="radio" name="visited" value="true"> Visité</label>
  </fieldset>

  <label data-visited-at-field hidden>
    Date de visite
    <input type="date" name="visitedAt">
  </label>

  <label>
    Description
    <textarea name="description" rows="4"></textarea>
  </label>

  <p><strong>Pays :</strong> <span data-field="country"></span></p>
  <p><strong>Coordonnées :</strong> <span data-field="coords"></span></p>

  <p data-place-error hidden></p>
  <p data-place-saved hidden>Modifications enregistrées.</p>

  <button type="submit">Enregistrer</button>
</form>

<!-- lien vers /place.html?id=... (rempli par infoPanel.js) -->
<a data-page-link hidden>Voir la fiche du lieu</a>

<button type="button" data-place-delete>Supprimer ce lieu</button>

<!-- modèle d'un média (une diapo du carrousel) -->
<template data-item="media">
  <li>
    <img data-media-img alt="" hidden>
    <video data-media-video controls preload="metadata" hidden></video>
    <span data-field="caption"></span>
  </li>
</template>
