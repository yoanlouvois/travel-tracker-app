<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Map</title>

  <!-- Bootstrap (local) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet (local) -->
  <link rel="stylesheet" href="/leaflet/leaflet.css" />
  <!-- Ton CSS -->
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="app-header" data-page="map">
      <div class="header-inner">

        <!-- Gauche : Menu sur la carte, retour à la carte sur les autres pages -->
        <div class="header-left">
          <button id="btnMenu" class="btn btn-header" type="button" aria-label="Menu" title="Menu" data-header-map-only>
            <i class="bi bi-list" aria-hidden="true"></i>
            <span class="btn-label">Menu</span>
          </button>
          <a class="btn btn-header" href="/" aria-label="Carte" title="Carte" data-header-pages-only>
            <i class="bi bi-map" aria-hidden="true"></i>
            <span class="btn-label">Carte</span>
          </a>
        </div>

        <!-- Centre : titre (lien vers la carte) -->
        <a class="header-center" href="/">
          <h1 class="app-title">
            <i class="bi bi-globe-europe-africa app-title-icon" aria-hidden="true"></i>
            <span>Travel Map</span>
          </h1>
          <p class="app-subtitle">Carnet de voyages</p>
        </a>

        <!-- Droite : pays, places, roadtrips, vlogs -->
        <nav class="header-right" aria-label="Navigation principale">
          <a class="btn btn-header" href="/country.html" data-nav="countries" aria-label="Mes pays" title="Mes pays">
            <i class="bi bi-globe2" aria-hidden="true"></i>
            <span class="btn-label">Mes pays</span>
          </a>
          <a class="btn btn-header" href="/roadtrip.html" data-nav="roadtrips" aria-label="Mes roadtrips" title="Mes roadtrips">
            <i class="bi bi-signpost-2" aria-hidden="true"></i>
            <span class="btn-label">Mes roadtrips</span>
          </a>
          <a class="btn btn-header" href="/vlogs.html" data-nav="vlogs" aria-label="Mes vlogs" title="Mes vlogs">
            <i class="bi bi-camera-reels" aria-hidden="true"></i>
            <span class="btn-label">Mes vlogs</span>
          </a>
        </nav>

      </div>
    </header>

    <!-- MAIN (sidebar + map) -->
    <div id="mainLayout" class="main">

      <!-- SIDEBAR (fermé/ouvert) -->
      <aside class="sidebar">
        <div class="sidebar-inner">

          <!-- Recherche de lieux (js/search.js -> /api/geocode/search) -->
          <nav class="navbar sidebar-search">
            <form class="d-flex w-100" role="search" data-search-form>
              <input
                id="searchInput"
                class="form-control form-control-sm me-2"
                type="search"
                name="q"
                placeholder="Rechercher un lieu…"
                aria-label="Rechercher un lieu"
                autocomplete="off"
              />
              <button id="btnSearch" class="btn btn-primary btn-sm" type="submit">Go</button>
            </form>
          </nav>

          <!-- Résultats de recherche -->
          <div class="search-results" data-search-results hidden>
            <div class="search-results-head">
              <span class="search-status" data-search-status></span>
              <button type="button" class="search-clear" data-search-clear aria-label="Effacer la recherche" title="Effacer">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
              </button>
            </div>

            <ul class="search-list" data-search-list></ul>

            <!-- modèle d'un résultat -->
            <template data-search-item>
              <li class="search-item">
                <button type="button" class="search-item-main" data-search-go title="Centrer la carte">
                  <i class="bi" data-search-icon aria-hidden="true"></i>
                  <span class="search-item-text">
                    <span class="search-item-name" data-search-name></span>
                    <span class="search-item-detail" data-search-detail></span>
                  </span>
                </button>

                <div class="search-item-actions">
                  <button type="button" class="btn btn-sm search-add-btn" data-search-add>
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Ajouter ce lieu
                  </button>
                  <button type="button" class="btn btn-sm" data-search-open hidden>
                    <i class="bi bi-geo-alt-fill" aria-hidden="true"></i> Voir mon lieu
                  </button>
                  <span class="search-item-note" data-search-note hidden></span>
                </div>

                <!-- options d'ajout -->
                <form class="search-add-form" data-search-add-form hidden>
                  <label class="search-add-label">
                    Type
                    <select name="type" class="form-select form-select-sm">
                      <option value="DEFAULT">Lieu</option>
                      <option value="CITY">Ville</option>
                      <option value="HIKE">Randonnée</option>
                      <option value="ACTIVITY">Activité</option>
                      <option value="VIEWPOINT">Point de vue</option>
                    </select>
                  </label>

                  <div class="search-add-status" role="radiogroup" aria-label="Statut">
                    <label><input type="radio" name="visited" value="false" checked> À visiter</label>
                    <label><input type="radio" name="visited" value="true"> Visité</label>
                  </div>

                  <div class="data-actions">
                    <button type="submit" class="btn btn-sm btn-primary">Ajouter</button>
                    <button type="button" class="btn btn-sm" data-search-add-cancel>Annuler</button>
                  </div>

                  <p class="search-add-error" data-search-add-error hidden></p>
                </form>
              </li>
            </template>
          </div>

          <div class="filters-section">

            <h6 class="filters-title">
              <i class="bi bi-funnel"></i>
              Filtres d'affichage
            </h6>
          
            <div class="filters-group">
          
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterVisited" checked>
                <label class="form-check-label" for="filterVisited">
                  Lieux visités
                </label>
              </div>
          
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterToVisit" checked>
                <label class="form-check-label" for="filterToVisit">
                  À visiter
                </label>
              </div>

              <hr class="filter-separator">

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterVille" checked>
                <label class="form-check-label" for="filterVille">
                  Villes
                </label>
              </div>

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterRadonnee" checked>
                <label class="form-check-label" for="filterRadonnee">
                  Randonnées
                </label>
              </div>

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterActivite" checked>
                <label class="form-check-label" for="filterActivite">
                  Activités
                </label>
              </div>

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterPointView" checked>
                <label class="form-check-label" for="filterPointView">
                  Points de vue
                </label>
              </div>
          
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterRoadtrips" checked>
                <label class="form-check-label" for="filterRoadtrips">
                  Roadtrips
                </label>
              </div>
          
              <hr class="filter-separator">
          
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterCountries">
                <label class="form-check-label" for="filterCountries">
                  Pays visités
                </label>
              </div>

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterCountriesToVisit">
                <label class="form-check-label" for="filterCountriesToVisit">
                  Pays à visiter
                </label>
              </div>

              <hr class="filter-separator">

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filterDetailledView">
                <label class="form-check-label" for="filterDetailledView">
                  Vue Détaillée
                </label>
              </div>
          
            </div>
          
          </div>

          <!-- Données : import / export JSON (js/backup.js) -->
          <div class="filters-section data-section" data-backup>

            <h6 class="filters-title">
              <i class="bi bi-database"></i>
              Données
            </h6>

            <p class="data-hint">
              Sauvegarde ta base en JSON, ou importe une sauvegarde :
              seuls les éléments absents sont ajoutés.
            </p>

            <div class="data-actions">
              <button type="button" class="btn btn-sm" data-backup-import>
                <i class="bi bi-upload" aria-hidden="true"></i> Importer
              </button>
              <button type="button" class="btn btn-sm" data-backup-export>
                <i class="bi bi-download" aria-hidden="true"></i> Exporter
              </button>
            </div>

            <input type="file" accept="application/json,.json" data-backup-file hidden>

            <!-- Aperçu du fichier avant import -->
            <div class="data-preview" data-backup-preview hidden>
              <p class="data-preview-name">
                <i class="bi bi-filetype-json" aria-hidden="true"></i>
                <span data-backup-filename></span>
              </p>
              <ul class="data-report" data-backup-preview-list></ul>
              <div class="data-actions">
                <button type="button" class="btn btn-sm btn-primary" data-backup-confirm>Importer</button>
                <button type="button" class="btn btn-sm" data-backup-cancel>Annuler</button>
              </div>
            </div>

            <!-- Résultat / erreurs -->
            <p class="data-message" data-backup-message hidden></p>
            <ul class="data-report" data-backup-report hidden></ul>

          </div>

          <div class="mt-auto d-flex justify-content-end">
            <button id="btnCloseMenu" class="btn btn-outline-light btn-sm" type="button">
              Fermer
            </button>
          </div>

        </div>
      </aside>

      <!-- MAP -->
      <main class="map-wrap">

        <div id="map"></div>
      
        <!-- TOOLBAR DROITE -->
        <div class="map-toolbar">
      
          <button id="toolAddVisited" class="tool-btn" title="Ajouter un lieu">
            <i class="bi bi-geo-alt"></i>
          </button>

          <button id="toolAddToVisit" class="tool-btn" title="A visiter">
            <i class="bi bi-bookmark-heart"></i>
          </button>

          <button id="toolAddCity" class="tool-btn" title="Ville">
            <i class="bi bi-buildings"></i>
          </button>
      
          <button id="toolAddHike" class="tool-btn" title="Randonnée">
            <i class="bi bi-backpack"></i>
          </button>

          <button id="toolAddActivity" class="tool-btn" title="Activité">
            <i class="bi bi-bicycle"></i>
          </button>

          <button id="toolAddViewpoint" class="tool-btn" title="Point de vue">
            <i class="bi bi-camera"></i>
          </button>

          <button id="toolAddRoadTrip" class="tool-btn" title="Roadtrip">
            <i class="bi bi-signpost-2"></i>
          </button>
      
          <button id="toolDeletePlace" class="tool-btn tool-danger" title="Supprimer">
            <i class="bi bi-trash"></i>
          </button>

          <button id="toolCountries" class="tool-btn" title="Pays visités">
            <i class="bi bi-globe-americas"></i>
          </button>

          <button id="toolCountriesFutur" class="tool-btn" title="Pays à visiter">
            <i class="bi bi-binoculars"></i>
          </button>
      
        </div>

        <aside id="infoPanel" class="info-panel">
        <div class="info-panel-inner">
          <div class="info-panel-header">
            <h5 id="infoPanelTitle" class="info-panel-title">Infos</h5>
            <button id="btnCloseInfoPanel" class="info-panel-close" type="button" aria-label="Fermer">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <div id="infoPanelContent" class="info-panel-content">
            <p class="text-secondary mb-0">Aucun élément sélectionné.</p>
          </div>
        </div>
      </aside>
      
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/leaflet/leaflet.js"></script>
  <script src="/js/map/toolManager.js"></script>
  <script src="/js/map/isoCodes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/map/leafletPlaces.js"></script>
  <script src="/js/map/leafletRoadtrip.js"></script>
  <script src="/js/map/leafletCountries.js"></script>
  <script src="/js/infoPanel.js"></script>
  <script src="/js/backup.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
